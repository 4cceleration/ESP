<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Panel</title>
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#14201c; --muted:#5d6b66; --line:#dfe5e2;
  --accent:#0a7d5a; --accent-ink:#ffffff; --warn:#b45309; --bad:#b42318; --track:#e6ebe8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1513; --card:#17211e; --ink:#e8efec; --muted:#93a39d; --line:#26332f;
    --accent:#3ddc97; --accent-ink:#06261a; --warn:#f5a524; --bad:#ff6b5e; --track:#24302c;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:20px 16px 40px;
}
main{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.875rem;margin-top:2px;word-break:break-word}
.pill{
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  border:1px solid var(--line);background:var(--card);
  padding:6px 11px;border-radius:999px;font-size:.8125rem;color:var(--muted);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--accent)}
.pill.ok{color:var(--ink)}
.pill.off .dot{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.led{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.led strong{display:block;font-size:1.05rem}
.switch{
  position:relative;flex:none;width:64px;height:36px;border-radius:999px;border:0;padding:0;
  background:var(--track);cursor:pointer;transition:background .15s;
}
.switch::after{
  content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s;
}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(28px)}
.switch:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.switch:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile .label{color:var(--muted);font-size:.8125rem}
.tile .value{font-size:1.5rem;font-weight:650;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .value small{font-size:.875rem;font-weight:500;color:var(--muted);margin-left:3px}
.tile .note{color:var(--muted);font-size:.8125rem;margin-top:4px;min-height:1.2em}
.bar{height:6px;border-radius:999px;background:var(--track);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .4s}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:.9rem}
dt{color:var(--muted)}
dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}
h2{font-size:.8125rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="name">ESP32 Panel</h1>
      <div class="sub" id="sub">Conectando…</div>
    </div>
    <span class="pill" id="pill"><span class="dot"></span><span id="pilltext">Conectando</span></span>
  </header>

  <div class="card led">
    <div>
      <strong>LED de la placa</strong>
      <span class="sub" id="ledtext">—</span>
    </div>
    <button class="switch" id="led" role="switch" aria-checked="false" aria-label="LED de la placa" disabled></button>
  </div>

  <div class="grid">
    <div class="card tile">
      <div class="label">Encendida hace</div>
      <div class="value" id="uptime">—</div>
      <div class="note" id="reqs"></div>
    </div>
    <div class="card tile">
      <div class="label">Temperatura del chip</div>
      <div class="value" id="temp">—</div>
      <div class="note">Sensor interno, aproximado</div>
    </div>
    <div class="card tile">
      <div class="label">Memoria libre</div>
      <div class="value" id="mem">—</div>
      <div class="bar"><i id="membar"></i></div>
    </div>
    <div class="card tile">
      <div class="label">Señal Wi-Fi</div>
      <div class="value" id="rssi">—</div>
      <div class="bar"><i id="rssibar"></i></div>
      <div class="note" id="rssinote"></div>
    </div>
  </div>

  <h2>Dispositivo</h2>
  <div class="card">
    <dl>
      <dt>Red</dt><dd id="d-net">—</dd>
      <dt>Dirección IP</dt><dd id="d-ip">—</dd>
      <dt>MAC</dt><dd id="d-mac">—</dd>
      <dt>Procesador</dt><dd id="d-cpu">—</dd>
      <dt>Flash</dt><dd id="d-flash">—</dd>
      <dt>MicroPython</dt><dd id="d-mpy">—</dd>
    </dl>
  </div>
</main>

<script>
var $ = function(id){ return document.getElementById(id); };
var fails = 0, busy = false;

function uptime(s){
  var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), x = s%60;
  if (d) return d + '<small>d</small> ' + h + '<small>h</small>';
  if (h) return h + '<small>h</small> ' + m + '<small>min</small>';
  if (m) return m + '<small>min</small> ' + x + '<small>s</small>';
  return x + '<small>s</small>';
}

function setLed(on){
  $('led').setAttribute('aria-checked', on ? 'true' : 'false');
  $('ledtext').textContent = on ? 'Encendido' : 'Apagado';
}

function online(ok){
  $('pill').className = 'pill ' + (ok ? 'ok' : 'off');
  $('pilltext').textContent = ok ? 'En línea' : 'Sin respuesta';
  $('led').disabled = !ok;
}

function render(s){
  document.title = s.name;
  $('name').textContent = s.name;
  var ap = s.mode === 'ap';
  $('sub').textContent = ap ? 'Red propia de la placa: ' + s.ssid : 'Conectada a ' + s.ssid;
  setLed(s.led);
  $('uptime').innerHTML = uptime(s.uptime_s);
  $('reqs').textContent = s.requests + ' peticiones atendidas';
  $('temp').innerHTML = s.temp_c === null ? '—' : s.temp_c.toFixed(1) + '<small>°C</small>';

  var kb = s.mem_free / 1024, pct = 100 * s.mem_free / s.mem_total;
  $('mem').innerHTML = kb.toFixed(0) + '<small>KB</small>';
  $('membar').style.width = pct.toFixed(0) + '%';
  $('membar').className = pct < 15 ? 'bad' : pct < 30 ? 'warn' : '';

  if (ap || s.rssi === null){
    $('rssi').textContent = '—';
    $('rssibar').style.width = '0';
    $('rssinote').textContent = ap ? 'No aplica en red propia' : '';
  } else {
    var q = Math.max(0, Math.min(100, 2 * (s.rssi + 100)));
    $('rssi').innerHTML = s.rssi + '<small>dBm</small>';
    $('rssibar').style.width = q + '%';
    $('rssibar').className = q < 30 ? 'bad' : q < 50 ? 'warn' : '';
    $('rssinote').textContent = q >= 70 ? 'Excelente' : q >= 50 ? 'Buena' : q >= 30 ? 'Regular' : 'Débil';
  }

  $('d-net').textContent = s.ssid + (ap ? ' (punto de acceso)' : '');
  $('d-ip').textContent = s.ip;
  $('d-mac').textContent = s.mac;
  $('d-cpu').textContent = s.cpu_mhz + ' MHz';
  $('d-flash').textContent = s.flash_mb + ' MB';
  $('d-mpy').textContent = s.micropython;
}

function poll(){
  if (busy) return;
  busy = true;
  fetch('/api/status', {cache: 'no-store'})
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(s){ fails = 0; online(true); render(s); })
    .catch(function(){ if (++fails >= 2) online(false); })
    .then(function(){ busy = false; });
}

$('led').addEventListener('click', function(){
  var want = this.getAttribute('aria-checked') !== 'true';
  setLed(want);
  fetch('/api/led', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({on: want})})
    .then(function(r){ return r.json(); })
    .then(function(j){ setLed(j.led); })
    .catch(function(){ setLed(!want); });
});

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
