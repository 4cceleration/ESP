<title>Stronglify</title>
<meta name="description" content="Genera páginas estáticas perfectas para SEO de manera masiva."/>
<meta name="robots" content="index"/>
<link rel="canonical" href="https://tudominio.com/"/><style>
html{line-height:1.15;-webkit-text-size-adjust:100%}body{margin:0}main{display:block}h1{font-size:2em;margin:.67em 0}hr{box-sizing:content-box;height:0;overflow:visible}pre{font-family:monospace,monospace;font-size:1em}a{background-color:transparent}abbr[title]{border-bottom:none;text-decoration:underline;text-decoration:underline dotted}b,strong{font-weight:bolder}code,kbd,samp{font-family:monospace,monospace;font-size:1em}small{font-size:80%}sub,sup{font-size:75%;line-height:0;position:relative;vertical-align:baseline}sub{bottom:-.25em}sup{top:-.5em}img{border-style:none}button,input,optgroup,select,textarea{font-family:inherit;font-size:100%;line-height:1.15;margin:0}button,input{overflow:visible}button,select{text-transform:none}button,[type=button],[type=reset],[type=submit]{-webkit-appearance:button}button::-moz-focus-inner,[type=button]::-moz-focus-inner,[type=reset]::-moz-focus-inner,[type=submit]::-moz-focus-inner{border-style:none;padding:0}button:-moz-focusring,[type=button]:-moz-focusring,[type=reset]:-moz-focusring,[type=submit]:-moz-focusring{outline:1px dotted ButtonText}
fieldset{padding:.35em .75em .625em}legend{box-sizing:border-box;color:inherit;display:table;max-width:100%;padding:0;white-space:normal}progress{vertical-align:baseline}textarea{overflow:auto}[type=checkbox],[type=radio]{box-sizing:border-box;padding:0}[type=number]::-webkit-inner-spin-button,[type=number]::-webkit-outer-spin-button{height:auto}[type=search]{-webkit-appearance:textfield;outline-offset:-2px}[type=search]::-webkit-search-decoration{-webkit-appearance:none}::-webkit-file-upload-button{-webkit-appearance:button;font:inherit}details{display:block}summary{display:list-item}template{display:none}[hidden]{display:none}img{max-width:100%;height:auto}
</style><style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{
  color:#000;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit}
.esp{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px 56px;
}
.esp h1{
  margin:0;font-size:clamp(3.2rem,15vw,8rem);line-height:.95;font-weight:700;letter-spacing:-.055em;
}
.lead{
  margin:28px 0 0;max-width:19ch;font-size:clamp(1.35rem,5.2vw,2.25rem);line-height:1.18;
  font-weight:700;letter-spacing:-.03em;text-wrap:balance;
}
.type{margin:26px 0 0;font-size:clamp(1.05rem,3.6vw,1.3rem);line-height:1.5;font-weight:400}
.call{margin:6px 0 0;font-size:clamp(1.05rem,3.6vw,1.3rem);line-height:1.5;font-weight:700}
.call span{
  background:linear-gradient(#000,#000) no-repeat 0 100%/100% 2px;padding-bottom:3px;
}
.cta{
  margin-top:36px;display:inline-flex;align-items:center;gap:.55em;
  padding:15px 28px;border:2px solid #000;border-radius:999px;
  color:#000;text-decoration:none;font-size:1.0625rem;font-weight:700;letter-spacing:-.01em;
}
.cta:hover,.cta:focus-visible{background:#000;color:#fff}
.cta:focus-visible{outline:3px solid #000;outline-offset:4px}
.blink{margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:18px}
.red{
  position:relative;width:84px;height:84px;padding:0;border:0;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 34% 28%,#ff7a6e 0,#e5231f 46%,#b80f0f 100%);
  box-shadow:0 7px 0 #8a0a0a,0 16px 26px rgba(229,35,31,.35);
  transition:transform .08s ease,box-shadow .08s ease;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.red::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #e5231f;opacity:0;pointer-events:none;
}
.red:active{transform:translateY(6px);box-shadow:0 1px 0 #8a0a0a,0 5px 10px rgba(229,35,31,.3)}
.red:focus-visible{outline:3px solid #000;outline-offset:6px}
.red.on::after{animation:ring .7s ease-out 3}
.red.on{animation:flash .22s steps(1) 8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blink-text{margin:0;font-size:.95rem;line-height:1.4;font-weight:400;min-height:1.4em}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}
@keyframes flash{50%{filter:brightness(1.45)}}
@media (prefers-reduced-motion:reduce){
  .red.on,.red.on::after{animation:none}
}
</style><meta name="viewport" content="width=device-width, initial-scale=1"/></head>
<body>
  <main class="esp">
  <h1>Stronglify</h1>
  <p class="lead">Genera páginas estáticas perfectas para SEO de manera masiva.</p>
  <p class="type">Construye tu página web en minutos.</p>
  <p class="call"><span>¡Regístrate y comienza a crear!</span></p>
  <a class="cta" href="https://app.stronglify.com">Ir a la aplicación <span aria-hidden="true">→</span></a>
  <div class="blink">
    <button class="red" id="blink" type="button" aria-describedby="blink-text"><span class="sr">Hacer titilar la placa</span></button>
    <p class="blink-text" id="blink-text" aria-live="polite" data-idle="Presiona el botón rojo y haz titilar la placa" data-ok="¡La placa está titilando!" data-fail="La placa no respondió">Presiona el botón rojo y haz titilar la placa</p>
  </div>
</main><script>
(function () {
  var d = document, btn = d.getElementById('blink'), msg = d.getElementById('blink-text'), timer;
  function say(key, on) {
    msg.textContent = msg.getAttribute('data-' + key);
    btn.classList.toggle('on', !!on);
  }
  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    btn.disabled = true;
    clearTimeout(timer);
    fetch('/api/blink', { method: 'POST' })
      .then(function (r) { say(r.ok ? 'ok' : 'fail', r.ok); })
      .catch(function () { say('fail', false); })
      .then(function () {
        timer = setTimeout(function () { say('idle', false); btn.disabled = false; }, 2200);
      });
  });
})();
</script>
</body></html>
