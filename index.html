</style><style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%;background:#fff;overflow-x:hidden}
body{
  color:#000;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit}

 
#ascii{
  position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,rgba(0,0,0,.14) 0,rgba(0,0,0,.14) 34%,#000 100%);
  mask-image:radial-gradient(circle closest-side at 50% 50%,rgba(0,0,0,.14) 0,rgba(0,0,0,.14) 34%,#000 100%);
}

 
.top{
  position:fixed;top:0;left:0;right:0;z-index:2;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px .55em;
  padding:calc(12px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 12px calc(16px + env(safe-area-inset-left,0px));
  background:#fff;border-bottom:2px solid #000;
  font-size:clamp(.8125rem,.74rem + .35vw,.95rem);line-height:1.35;font-weight:700;text-align:center;
}
.top a{color:inherit;text-underline-offset:3px;white-space:nowrap;padding:4px 0}
.top a:focus-visible{outline:3px solid #000;outline-offset:3px}
@media (max-width:560px){
  .top{flex-direction:column;gap:0;padding-bottom:10px}
  .top .dot{display:none}
}

.esp{
  position:relative;z-index:1;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  padding:calc(96px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px));
}
.blink{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vmin,22px)}
.red{
  --s:clamp(84px,24vmin,150px);
  position:relative;width:var(--s);height:var(--s);padding:0;border:0;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 34% 28%,#ff7a6e 0,#e5231f 46%,#b80f0f 100%);
  box-shadow:0 calc(var(--s)*.085) 0 #8a0a0a,0 calc(var(--s)*.19) calc(var(--s)*.3) rgba(229,35,31,.35);
  transition:transform .08s ease,box-shadow .08s ease;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.red::after{
  content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid #e5231f;opacity:0;pointer-events:none;
}
.red:active{transform:translateY(calc(var(--s)*.07));box-shadow:0 calc(var(--s)*.015) 0 #8a0a0a,0 calc(var(--s)*.06) calc(var(--s)*.12) rgba(229,35,31,.3)}
.red:focus-visible{outline:3px solid #000;outline-offset:8px}
.red.on::after{animation:ring .7s ease-out 3}
.red.on{animation:flash .22s steps(1) 8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blink-text{
  margin:0;max-width:22ch;min-height:1.4em;
  font-size:clamp(.95rem,.85rem + .5vw,1.15rem);line-height:1.4;font-weight:700;text-wrap:balance;
  text-shadow:0 0 6px #fff,0 0 14px #fff,0 0 24px #fff;
}

 
@media (max-height:420px){
  .esp{padding-top:calc(64px + env(safe-area-inset-top,0px));padding-bottom:16px}
  .top{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px}
}

@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}
@keyframes flash{50%{filter:brightness(1.45)}}
@media (prefers-reduced-motion:reduce){
  .red.on,.red.on::after{animation:none}
}
</style><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&#39;http://www.w3.org/2000/svg&#39; viewBox=&#39;0 0 32 32&#39;%3E%3Ccircle cx=&#39;16&#39; cy=&#39;17&#39; r=&#39;13&#39; fill=&#39;%238a0a0a&#39;/%3E%3Ccircle cx=&#39;16&#39; cy=&#39;15&#39; r=&#39;13&#39; fill=&#39;%23e5231f&#39;/%3E%3Ccircle cx=&#39;12&#39; cy=&#39;10&#39; r=&#39;4&#39; fill=&#39;%23ff7a6e&#39;/%3E%3C/svg%3E"/></head>
<body>
  <canvas id="ascii" aria-hidden="true"></canvas>
<header class="top">
  <span>Funcionando en un ESP32</span>
  <span class="dot" aria-hidden="true">·</span>
  <a href="https://app.stronglify.com">Generado con Stronglify</a>
  <span class="dot" aria-hidden="true">·</span>
  <a href="https://github.com/4cceleration/ESP">Ver el repositorio</a>
</header>
<main class="esp">
  <div class="blink">
    <button class="red" id="blink" type="button" aria-describedby="blink-text"><span class="sr">Hacer titilar la placa</span></button>
    <p class="blink-text" id="blink-text" aria-live="polite" data-idle="" data-ok="¡La placa está titilando!" data-fail="La placa no respondió"></p>
  </div>
</main><script>
(function () {
  var d = document;

  
  var btn = d.getElementById('blink'), msg = d.getElementById('blink-text'), timer;
  function say(key, on) {
    msg.textContent = msg.getAttribute('data-' + key);
    btn.classList.toggle('on', !!on);
  }
  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    btn.disabled = true;
    clearTimeout(timer);
    splash = 1;
    fetch('/api/blink', { method: 'POST' })
      .then(function (r) { say(r.ok ? 'ok' : 'fail', r.ok); })
      .catch(function () { say('fail', false); })
      .then(function () {
        timer = setTimeout(function () { say('idle', false); btn.disabled = false; }, 2200);
      });
  });

  
  var cv = d.getElementById('ascii'), cx = cv.getContext('2d');
  var RAMPS = [
    ' ..,:;-~=+*xX#%@',
    '   .oO0@',
    ' .-/\\|X#',
    ' .:=+*#%@',
    '  01',
    ' _.-~^*#',
    ' .:|!I#',
    ' .()[]{}#',
    ' .<>^v*@',
    ' `,;!i*%#'
  ];
  var SEG_S = 5, NS = 10;
  var CW = 9, CH = 16, cols = 0, rows = 0, dpr = 1;
  var mx = -9, my = -9, tx = -9, ty = -9, splash = 0, last = 0, running = true;
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sin = Math.sin, cos = Math.cos, sqrt = Math.sqrt, atan2 = Math.atan2, log = Math.log;

  function scene(i, X, Y, t) {  
    var r, a, w, p, q;
    switch (i) {
      case 0:                   
        w = sin(Y * 1.3 + t * 0.7) + cos(X * 0.9 - t * 0.5);
        return (sin(X * 1.1 + w + t * 0.4) + sin(Y * 1.7 - w * 1.3 + t * 0.6)
              + sin((X + Y) * 0.6 + t * 0.9 + sin(w + t * 0.3) * 1.4)) / 3;
      case 1:                   
        p = X - 2.2 * sin(t * 0.5); q = Y - 1.4 * cos(t * 0.4); r = sqrt(p * p + q * q);
        p = X + 2.6 * cos(t * 0.3); q = Y + 1.6 * sin(t * 0.6); a = sqrt(p * p + q * q);
        return (sin(r * 3.2 - t * 3.4) + sin(a * 2.5 - t * 2.3)) / 2;
      case 2:                   
        r = sqrt(X * X + Y * Y); a = atan2(Y, X);
        return sin(a * 3 + r * 2.4 - t * 2.1 + sin(r * 1.3 - t) * 1.5);
      case 3:                   
        return sin((X + Y) * 1.9 + sin(X * 1.4 - t * 1.1) * 2.2 + t * 1.6) * cos(Y * 1.1 + sin(X + t * 0.7));
      case 4:                   
        r = sqrt(X * X + Y * Y);
        return (sin(X * 3.1 + t * 1.2) * sin(Y * 3.1 - t * 1.5) + sin(r * 3.6 - t * 3) * 0.6) / 1.4;
      case 5:                   
        r = sqrt(X * X + Y * Y) + 0.18; a = atan2(Y, X);
        return sin(2.2 / r + a * 2 + t * 2.4) * cos(a * 4 - t * 1.3 + r);
      case 6:                   
        return sin(X * 8.5 + sin(Y * 0.7 + t) * 1.6) * sin(Y * 2.3 - t * 4.5 + sin(X * 5.1) * 3);
      case 7:                   
        return sin((X * X + Y * Y) * 1.15 - t * 3.2) * cos(X * 0.8 + t * 0.6);
      case 8:                   
        r = sqrt(X * X + Y * Y) + 0.2; a = atan2(Y, X);
        return sin(a * 2 - log(r) * 5.5 + t * 1.9) * (0.55 + 0.45 * sin(r * 2.1 - t * 1.2));
      default:                  
        return (sin(X * 1.7 + t) * cos(Y * 2.3 - t * 1.2)
              + 0.5 * sin(X * 4.1 - t * 1.7) * cos(Y * 3.7 + t * 1.4)
              + 0.25 * sin(X * 8.3 + t * 2.3) * cos(Y * 7.9 - t * 2)) / 1.4;
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    if (w < 600) { CW = 8; CH = 14; } else { CW = 9; CH = 16; }
    cols = Math.ceil(w / CW) + 1;
    rows = Math.ceil(h / CH) + 1;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.font = (CH - 2) + 'px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
    cx.textBaseline = 'top';
    cx.fillStyle = '#000';
  }

  function draw(ms) {
    var real = ms * 0.001;
    var t = real + 1.3 * sin(real * 0.37);           
    var k = Math.floor(real / SEG_S), f = real / SEG_S - k;
    var sa = k % NS, sb = (k + 1) % NS;
    var mix = f * f * (3 - 2 * f);                   
    var ra = RAMPS[sa], rb = RAMPS[sb];
    var zoom = 1 + 0.4 * sin(real * 0.23), rot = real * 0.06 + 0.5 * sin(real * 0.11);
    var cr = cos(rot) * zoom, sr = sin(rot) * zoom;
    var hx = cols / 2, hy = rows / 2;

    mx += (tx - mx) * 0.08; my += (ty - my) * 0.08;
    splash *= 0.965;
    cx.clearRect(0, 0, cv.width, cv.height);

    for (var y = 0; y < rows; y++) {
      var py = (y - hy) * 0.115, line = '';
      for (var x = 0; x < cols; x++) {
        var px = (x - hx) * 0.062;
        var X = px * cr - py * sr, Y = px * sr + py * cr;
        var b = scene(sa, X, Y, t);
        b += (scene(sb, X, Y, t) - b) * mix;

        var dx = (x - mx) * 0.55, dy = y - my, dist = sqrt(dx * dx + dy * dy);
        b += 0.6 * Math.exp(-dist * dist * 0.012) * sin(dist * 0.9 - t * 5);
        if (splash > 0.02) {
          var ex = (x - hx) * 0.55, ey = y - hy;
          b += splash * 0.8 * sin(sqrt(ex * ex + ey * ey) * 0.5 - real * 9);
        }

        var n = (b + 1) * 0.5;
        n = n < 0 ? 0 : n > 1 ? 1 : n;
        
        var cell = (((x * 73856093) ^ (y * 19349663)) & 1023) / 1023;
        var ramp = cell < mix ? rb : ra;
        line += ramp.charAt((n * n * (ramp.length - 1) + 0.5) | 0);
      }
      cx.fillText(line, 0, y * CH);
    }
  }

  function loop(ms) {
    if (!running) return;
    if (ms - last > 30) { last = ms; draw(ms); }
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', function () { resize(); if (still) draw(4000); });
  window.addEventListener('pointermove', function (e) { tx = e.clientX / CW; ty = e.clientY / CH; }, { passive: true });
  d.addEventListener('visibilitychange', function () {
    running = !d.hidden && !still;
    if (running) requestAnimationFrame(loop);
  });

  resize();
  if (still) { running = false; draw(4000); } else { requestAnimationFrame(loop); }
})();
</script>
</body></html>
